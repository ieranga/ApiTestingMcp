name: Build and Push to Azure Container Registry

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry (ACR)
      uses: docker/login-action@v3
      with:
        registry: apitestingmcpcr.azurecr.io
        username: apitestingmcpcr
        password: ${{ secrets.APITESTINGMCPCR || secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          apitestingmcpcr.azurecr.io/apitestingmcp:latest
          apitestingmcpcr.azurecr.io/apitestingmcp:${{ github.sha }}
